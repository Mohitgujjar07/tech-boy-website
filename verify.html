<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AarambhX Academy — Official Student Certificate Verification Portal</title>
  
  <meta name="description" content="Instant public verification of student credentials and workshop training certificates issued by AarambhX Technology & Academy.">
  <meta name="theme-color" content="#2563EB">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="icon" type="image/jpeg" href="assets/aarambhx-logo.jpg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <!-- Public Design System -->
  <link rel="stylesheet" href="styles.css">

  <style>
    .verify-page-wrapper {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.08) 0%, transparent 60%), var(--bg-body, #F8FAFC);
      padding: 100px 16px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .verify-container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
    }

    .verify-header-card {
      text-align: center;
      margin-bottom: 32px;
    }

    .verify-brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px;
      background: rgba(37, 99, 235, 0.08);
      border: 1px solid rgba(37, 99, 235, 0.2);
      border-radius: 9999px;
      margin-bottom: 16px;
      text-decoration: none;
      color: #2563EB;
      font-weight: 700;
      font-size: 0.875rem;
    }

    .verify-title {
      font-family: var(--font-display, 'Space Grotesk', sans-serif);
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      font-weight: 800;
      color: var(--text-primary, #0F172A);
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }

    .verify-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted, #64748B);
      max-width: 520px;
      margin: 0 auto 24px;
      line-height: 1.6;
    }

    .verify-search-box {
      display: flex;
      gap: 8px;
      background: #FFFFFF;
      padding: 6px 8px;
      border-radius: 12px;
      border: 1px solid var(--border, #E2E8F0);
      box-shadow: 0 4px 20px -4px rgba(15, 23, 42, 0.08);
      margin-bottom: 28px;
    }

    body.dark-theme .verify-search-box {
      background: #1E293B;
      border-color: rgba(255, 255, 255, 0.1);
    }

    .verify-search-input {
      flex: 1;
      border: none;
      outline: none;
      padding: 10px 14px;
      font-family: monospace;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-primary, #0F172A);
      background: transparent;
      text-transform: uppercase;
    }

    .verify-search-btn {
      background: #2563EB;
      color: #FFFFFF;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .verify-search-btn:hover {
      background: #1D4ED8;
      transform: translateY(-1px);
    }

    /* Result Card */
    .cert-result-card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 12px 36px -4px rgba(15, 23, 42, 0.08);
      position: relative;
      overflow: hidden;
    }

    body.dark-theme .cert-result-card {
      background: #1E293B;
      border-color: rgba(255, 255, 255, 0.1);
    }

    .cert-result-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #10B981, #2563EB, #8B5CF6);
    }

    .cert-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .cert-status-verified {
      background: rgba(16, 185, 129, 0.12);
      color: #10B981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .cert-status-revoked {
      background: rgba(239, 68, 68, 0.12);
      color: #EF4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .cert-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-top: 20px;
    }

    @media (max-width: 540px) {
      .cert-grid { grid-template-columns: 1fr; }
    }

    .cert-field-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted, #64748B);
      margin-bottom: 4px;
      font-weight: 600;
    }

    .cert-field-value {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-primary, #0F172A);
    }

    .cert-code-chip {
      font-family: monospace;
      font-size: 1.1rem;
      color: #2563EB;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .cert-seal-strip {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px dashed var(--border, #E2E8F0);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .cert-seal-info {
      font-size: 0.78rem;
      color: var(--text-muted, #64748B);
    }

    .cert-btn-print {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.8125rem;
      font-weight: 700;
      background: var(--bg-subtle, #F1F5F9);
      border: 1px solid var(--border, #E2E8F0);
      color: var(--text-primary, #0F172A);
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .cert-btn-print:hover {
      background: #2563EB;
      color: #FFFFFF;
      border-color: #2563EB;
    }

    .cert-not-found {
      text-align: center;
      padding: 32px 16px;
      background: rgba(239, 68, 68, 0.05);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 16px;
      color: #EF4444;
    }
  </style>
</head>
<body>

  <div class="verify-page-wrapper">
    <div class="verify-container">
      
      <!-- Header -->
      <div class="verify-header-card">
        <a href="academy.html" class="verify-brand-badge">
          <i data-lucide="shield-check" style="width:16px; height:16px;"></i>
          <span>AarambhX Academy Credential Engine</span>
        </a>
        <h1 class="verify-title">Certificate Authenticity Verification</h1>
        <p class="verify-subtitle">Verify student training credentials, workshop completion honors, and industrial lab certifications issued by AarambhX Technology.</p>

        <!-- Search Form -->
        <form class="verify-search-box" id="verifyForm">
          <input type="text" id="verifyInput" class="verify-search-input" placeholder="Enter ID e.g. AX-2026-AIML-0101" required>
          <button type="submit" class="verify-search-btn">
            <i data-lucide="search" style="width:16px; height:16px;"></i>
            <span>Verify</span>
          </button>
        </form>
      </div>

      <!-- Result Container -->
      <div id="verifyResultArea"></div>

      <!-- Footer back link -->
      <div style="text-align: center; margin-top: 32px;">
        <a href="index.html" style="color: var(--text-muted, #64748B); font-size: 0.85rem; text-decoration: none; font-weight: 600;">
          &larr; Return to AarambhX Technology Home
        </a>
      </div>

    </div>
  </div>

  <script src="admin-store.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const Store = window.AarambhXStore;
      const verifyForm = document.getElementById('verifyForm');
      const verifyInput = document.getElementById('verifyInput');
      const verifyResultArea = document.getElementById('verifyResultArea');

      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function runVerification(id) {
        if (!id) return;
        verifyInput.value = id;

        const cert = Store ? Store.verifyCertificate(id) : null;
        if (cert) {
          const isVerified = cert.status === 'Verified';
          verifyResultArea.innerHTML = `
            <div class="cert-result-card" id="certificateRecord">
              <div class="cert-status-badge ${isVerified ? 'cert-status-verified' : 'cert-status-revoked'}">
                <i data-lucide="${isVerified ? 'check-circle' : 'alert-circle'}" style="width:14px; height:14px;"></i>
                <span>${isVerified ? 'Official Authenticity Verified' : 'Certificate Revoked'}</span>
              </div>

              <div class="cert-field-label">Student Name</div>
              <div class="cert-field-value" style="font-size: 1.45rem; margin-bottom: 16px; color: #2563EB;">${escapeHtml(cert.studentName)}</div>

              <div class="cert-grid">
                <div>
                  <div class="cert-field-label">Certificate Serial ID</div>
                  <div class="cert-code-chip">${escapeHtml(cert.id)}</div>
                </div>
                <div>
                  <div class="cert-field-label">Awarded Grade / Honors</div>
                  <div class="cert-field-value">${escapeHtml(cert.grade || 'First Class')}</div>
                </div>
                <div>
                  <div class="cert-field-label">Training Track</div>
                  <div class="cert-field-value">${escapeHtml(cert.track)}</div>
                </div>
                <div>
                  <div class="cert-field-label">College / Institution</div>
                  <div class="cert-field-value">${escapeHtml(cert.institution)}</div>
                </div>
                <div>
                  <div class="cert-field-label">Date of Issuance</div>
                  <div class="cert-field-value">${escapeHtml(cert.issueDate)}</div>
                </div>
                <div>
                  <div class="cert-field-label">Issued By</div>
                  <div class="cert-field-value">AarambhX Academy, Tumakuru</div>
                </div>
              </div>

              <div class="cert-seal-strip">
                <div class="cert-seal-info">
                  <strong>Digital Signature:</strong> Verified on AarambhX Distributed Registry<br>
                  Security Hash: SHA256-${escapeHtml(cert.id.replace(/-/g, ''))}
                </div>
                <button type="button" class="cert-btn-print" onclick="window.print()">
                  <i data-lucide="printer" style="width:14px; height:14px;"></i>
                  <span>Print Record</span>
                </button>
              </div>
            </div>
          `;
        } else {
          verifyResultArea.innerHTML = `
            <div class="cert-not-found">
              <i data-lucide="alert-triangle" style="width:36px; height:36px; margin: 0 auto 12px; display: block;"></i>
              <h3 style="font-size: 1.15rem; margin-bottom: 6px; font-weight: 700;">No Authentic Record Found</h3>
              <p style="font-size: 0.9rem; color: var(--text-muted, #64748B); max-width: 440px; margin: 0 auto;">
                We could not locate a verified certificate matching the serial ID "<strong>${escapeHtml(id)}</strong>". Please verify the code on your physical certificate.
              </p>
            </div>
          `;
        }

        if (window.lucide) window.lucide.createIcons();
      }

      if (verifyForm) {
        verifyForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const q = verifyInput.value.trim();
          if (q) {
            window.history.replaceState(null, '', `?id=${encodeURIComponent(q)}`);
            runVerification(q);
          }
        });
      }

      // Check URL query param ?id=...
      const urlParams = new URLSearchParams(window.location.search);
      const initialId = urlParams.get('id');
      if (initialId) {
        runVerification(initialId.trim());
      } else {
        // Default initial demonstration view
        runVerification('AX-2026-AIML-0101');
      }

      if (window.lucide) window.lucide.createIcons();
    });
  </script>
</body>
</html>
